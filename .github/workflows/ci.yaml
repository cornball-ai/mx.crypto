name: ci

on:
  pull_request:

env:
  _R_CHECK_FORCE_SUGGESTS_: "false"

jobs:
  ci:
    strategy:
      fail-fast: false
      matrix:
        # rust: stable is what CRAN's machines track (Fedora and M1mac ran
        # 1.99.1 when 0.3.0 was published); a compiler pinned to the MSRV
        # cannot print a warning a newer one introduced. rust: 1.85 proves
        # the SystemRequirements floor.
        include:
          - {os: macos-latest, rust: stable}
          - {os: ubuntu-latest, rust: stable}
          - {os: ubuntu-latest, rust: "1.85"}

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - name: Setup
        uses: eddelbuettel/github-actions/r-ci@master
        with:
          # Must be the action input, not `env: BACKEND:`. run.sh reads a
          # BACKEND env var, but the action exports inputs.backend over it,
          # so a workflow-level env is silently ignored and the log shows
          # "Selecting 'bspm'" while CI still goes green.
          backend: RAPT

      - name: Install Rust toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain ${{ matrix.rust }} --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Dependencies
        run: ./run.sh install_deps

      - name: Install vignette builder
        # simplermarkdown is in Suggests, not Imports, so install_deps
        # skips it. R CMD check needs it present to recognise the
        # Markdown source as a vignette and not a stray file.
        run: Rscript -e 'install.packages("simplermarkdown")'

      - name: Test
        run: ./run.sh run_tests
        env:
          R_BUILD_ARGS: "--no-manual"
          R_CHECK_ARGS: "--no-manual --as-cran"

      - name: Check warnings and SAS coverage
        run: Rscript .github/check-results.R
